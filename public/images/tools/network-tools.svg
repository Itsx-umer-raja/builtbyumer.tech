  </defs>
  <rect width="800" height="600" fill="url(#netbg)"/>
  <!-- wireframe globe -->
  <g transform="translate(400 300)" stroke="#111111" stroke-width="2.5" fill="none">
    <circle r="190" stroke-opacity="0.85"/>
    <ellipse rx="190" ry="70" stroke-opacity="0.3"/>
