  </defs>
  <rect width="800" height="600" fill="url(#pdfbg)"/>
  <!-- back sheets -->
  <g transform="translate(430 120) rotate(6)">
    <rect width="240" height="320" rx="12" fill="#ffffff" stroke="#111111" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="28" y="36" width="150" height="10" rx="5" fill="#111111" fill-opacity="0.25"/>
    <rect x="28" y="60" width="184" height="6" rx="3" fill="#111111" fill-opacity="0.12"/>
