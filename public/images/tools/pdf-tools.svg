    <rect x="30" y="120" width="180" height="8" rx="4" fill="#111111" fill-opacity="0.35"/>
    <rect x="30" y="142" width="140" height="8" rx="4" fill="#111111" fill-opacity="0.2"/>
    <rect x="30" y="164" width="164" height="8" rx="4" fill="#111111" fill-opacity="0.2"/>
    <rect x="30" y="186" width="120" height="8" rx="4" fill="#111111" fill-opacity="0.2"/>
    <rect x="30" y="225" width="90" height="46" rx="8" fill="#C6F35C"/>
    <text x="75" y="256" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#163D2B" text-anchor="middle">PDF</text>
