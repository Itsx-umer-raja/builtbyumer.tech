<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="imgbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfcfc"/>
      <stop offset="1" stop-color="#e8ebe9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#imgbg)"/>
  <!-- frame -->
  <g transform="translate(200 110)">
    <rect width="400" height="330" rx="16" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <!-- landscape inside -->
    <clipPath id="frameclip"><rect x="6" y="6" width="388" height="318" rx="12"/></clipPath>
    <g clip-path="url(#frameclip)">
      <rect x="6" y="6" width="388" height="318" fill="#eef1ef"/>
      <circle cx="90" cy="90" r="42" fill="#C6F35C"/>
      <path d="M6 324 120 180 210 280 290 200 394 324 Z" fill="#163D2B" fill-opacity="0.75"/>
      <path d="M6 324 90 240 180 324 Z" fill="#163D2B" fill-opacity="0.45"/>
    </g>
    <!-- crop marks -->
    <g stroke="#111111" stroke-width="3">
      <path d="M-16 26 h20 M-16 6 h6 M6 -16 v20 M26 -16 h-20"/>
      <path d="M396 -16 v20 M374 -16 h20 M416 26 h-20"/>
      <path d="M416 304 h-20 M416 324 v-6 M396 346 h20"/>
      <path d="M-16 304 h20 M-16 324 v-6 M6 346 h-20"/>
    </g>
    <!-- corner handles -->
    <g fill="#ffffff" stroke="#111111" stroke-width="3">
      <rect x="-10" y="-10" width="20" height="20" rx="4"/>
      <rect x="390" y="-10" width="20" height="20" rx="4"/>
      <rect x="-10" y="320" width="20" height="20" rx="4"/>
      <rect x="390" y="320" width="20" height="20" rx="4"/>
    </g>
  </g>
  <!-- floating pixels -->
  <g>
    <rect x="120" y="470" width="26" height="26" rx="6" fill="#163D2B" fill-opacity="0.7" transform="rotate(-10 133 483)"/>
    <rect x="640" y="120" width="22" height="22" rx="6" fill="#C6F35C" transform="rotate(14 651 131)"/>
    <rect x="660" y="480" width="18" height="18" rx="5" fill="#111111" fill-opacity="0.3" transform="rotate(-8 669 489)"/>
  </g>
  <circle cx="90" cy="120" r="5" fill="#111111" fill-opacity="0.3"/>
</svg>
